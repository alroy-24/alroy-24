<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="900" height="6">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#b026ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style><![CDATA[
    @keyframes mv { 0%{transform:translateX(-240px)} 100%{transform:translateX(900px)} }
    .mv{animation:mv 3.2s linear infinite}
  ]]></style>
  <rect x="0" y="2" width="900" height="1.6" fill="#2a0a44"/>
  <g class="mv">
    <rect x="0" y="0" width="220" height="6" fill="url(#neon)" filter="url(#g)"/>
  </g>
</svg>
