<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style><![CDATA[
    @keyframes rise { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0);} }
    @keyframes draw { to { stroke-dashoffset:0; } }
    @keyframes fade { to { opacity:1; } }
    .name { opacity:0; animation: rise .9s ease forwards .15s; }
    .sub  { opacity:0; animation: fade 1s ease forwards .9s; }
    .line { stroke-dasharray:170; stroke-dashoffset:170; animation: draw 1.3s ease forwards .5s; }
    .dot  { opacity:0; animation: fade .6s ease forwards 1.7s; }
  ]]></style>

  <!-- self-contained card so it looks identical in light & dark mode -->
  <rect x="1" y="1" width="898" height="208" rx="16" fill="#0f1419" stroke="#232a35"/>

  <text class="name" x="450" y="96" text-anchor="middle" fill="#e6edf3" font-size="46" font-weight="600" letter-spacing="1">Alroy Pereira</text>

  <line class="line" x1="365" y1="120" x2="535" y2="120" stroke="#88c0d0" stroke-width="2" stroke-linecap="round"/>
  <circle class="dot" cx="535" cy="120" r="3.2" fill="#88c0d0"/>

  <text class="sub" x="450" y="156" text-anchor="middle" fill="#8b98a9" font-size="16" letter-spacing="3">DATA SCIENTIST &#183; MACHINE LEARNING &#183; NLP &#183; DEEP LEARNING</text>
</svg>
