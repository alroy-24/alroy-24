<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
  </defs>
  <style><![CDATA[
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes scan { 0%{transform:translateY(50px)} 100%{transform:translateY(282px)} }
    .cur{opacity:0;animation:blink 1s step-end infinite 3.5s}
    .scan{animation:scan 3.6s linear infinite}
  ]]></style>

  <!-- window -->
  <rect x="8" y="8" width="744" height="274" rx="12" fill="#0a0613" stroke="#b026ff" stroke-width="1.5" filter="url(#glow)"/>
  <!-- title bar -->
  <path d="M8,20 a12,12 0 0 1 12,-12 h720 a12,12 0 0 1 12,12 v22 h-744 z" fill="#160a2b"/>
  <circle cx="32" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="27" r="6" fill="#27c93f"/>
  <text x="380" y="32" text-anchor="middle" fill="#7a6f9b" font-size="14" letter-spacing="1">alroy@github : ~/profile — bash</text>
  <line x1="8" y1="42" x2="752" y2="42" stroke="#2a0a44"/>

  <!-- boot log -->
  <g font-size="16">
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.2s" dur="0.2s" fill="freeze"/>
      <text x="28" y="80"><tspan fill="#00f0ff">$ </tspan><tspan fill="#e9e3ff">./initialize_profile.sh</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.2s" fill="freeze"/>
      <text x="28" y="108"><tspan fill="#7a6f9b">&gt; mounting /dev/data ............. </tspan><tspan fill="#39ff14">[ OK ]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.2s" dur="0.2s" fill="freeze"/>
      <text x="28" y="136"><tspan fill="#7a6f9b">&gt; loading models: nlp · dl · ml ... </tspan><tspan fill="#39ff14">[ OK ]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" dur="0.2s" fill="freeze"/>
      <text x="28" y="164"><tspan fill="#7a6f9b">&gt; calibrating neural weights ...... </tspan><tspan fill="#39ff14">[ OK ]</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.4s" dur="0.2s" fill="freeze"/>
      <text x="28" y="200"><tspan fill="#7a6f9b">&gt; identity: </tspan><tspan fill="#00f0ff" font-weight="bold">ALROY PEREIRA</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="2.9s" dur="0.2s" fill="freeze"/>
      <text x="28" y="228"><tspan fill="#7a6f9b">&gt; role: </tspan><tspan fill="#ff2bd6" font-weight="bold">DATA SCIENTIST // ML · NLP · DEEP LEARNING</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" to="1" begin="3.4s" dur="0.2s" fill="freeze"/>
      <text x="28" y="256"><tspan fill="#7a6f9b">&gt; status: </tspan><tspan fill="#ffe600" font-weight="bold">READY</tspan></text>
    </g>
    <rect class="cur" x="118" y="244" width="11" height="16" fill="#ffe600"/>
  </g>

  <!-- moving scanline -->
  <rect class="scan" x="8" y="0" width="744" height="40" fill="#00f0ff" opacity="0.05"/>
</svg>
