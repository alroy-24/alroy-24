<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <filter id="g" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="320" fill="#05010d"/>

  <!-- DATA ANALYTICS 90 -->
  <text x="18" y="40" fill="#cbd5e1" font-size="15" letter-spacing="1">DATA ANALYTICS</text>
  <rect x="210" y="24" width="480" height="22" rx="2" fill="#160a2b" stroke="#00f0ff" stroke-opacity="0.35"/>
  <rect x="210" y="24" width="0" height="22" rx="2" fill="#00f0ff" filter="url(#g)">
    <animate attributeName="width" from="0" to="432" dur="1.4s" begin="0.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="742" y="40" text-anchor="end" fill="#00f0ff" font-size="14" font-weight="bold">90</text>

  <!-- MACHINE LEARNING 88 -->
  <text x="18" y="90" fill="#cbd5e1" font-size="15" letter-spacing="1">MACHINE LEARNING</text>
  <rect x="210" y="74" width="480" height="22" rx="2" fill="#160a2b" stroke="#ff2bd6" stroke-opacity="0.35"/>
  <rect x="210" y="74" width="0" height="22" rx="2" fill="#ff2bd6" filter="url(#g)">
    <animate attributeName="width" from="0" to="422" dur="1.4s" begin="0.25s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="742" y="90" text-anchor="end" fill="#ff2bd6" font-size="14" font-weight="bold">88</text>

  <!-- NLP 85 -->
  <text x="18" y="140" fill="#cbd5e1" font-size="15" letter-spacing="1">NLP</text>
  <rect x="210" y="124" width="480" height="22" rx="2" fill="#160a2b" stroke="#39ff14" stroke-opacity="0.35"/>
  <rect x="210" y="124" width="0" height="22" rx="2" fill="#39ff14" filter="url(#g)">
    <animate attributeName="width" from="0" to="408" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="742" y="140" text-anchor="end" fill="#39ff14" font-size="14" font-weight="bold">85</text>

  <!-- DEEP LEARNING 84 -->
  <text x="18" y="190" fill="#cbd5e1" font-size="15" letter-spacing="1">DEEP LEARNING</text>
  <rect x="210" y="174" width="480" height="22" rx="2" fill="#160a2b" stroke="#b026ff" stroke-opacity="0.35"/>
  <rect x="210" y="174" width="0" height="22" rx="2" fill="#b026ff" filter="url(#g)">
    <animate attributeName="width" from="0" to="403" dur="1.4s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="742" y="190" text-anchor="end" fill="#b026ff" font-size="14" font-weight="bold">84</text>

  <!-- PYTHON 92 -->
  <text x="18" y="240" fill="#cbd5e1" font-size="15" letter-spacing="1">PYTHON</text>
  <rect x="210" y="224" width="480" height="22" rx="2" fill="#160a2b" stroke="#ffe600" stroke-opacity="0.35"/>
  <rect x="210" y="224" width="0" height="22" rx="2" fill="#ffe600" filter="url(#g)">
    <animate attributeName="width" from="0" to="442" dur="1.4s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="742" y="240" text-anchor="end" fill="#ffe600" font-size="14" font-weight="bold">92</text>

  <!-- DATA VIZ 86 -->
  <text x="18" y="290" fill="#cbd5e1" font-size="15" letter-spacing="1">DATA VIZ</text>
  <rect x="210" y="274" width="480" height="22" rx="2" fill="#160a2b" stroke="#ff7a00" stroke-opacity="0.35"/>
  <rect x="210" y="274" width="0" height="22" rx="2" fill="#ff7a00" filter="url(#g)">
    <animate attributeName="width" from="0" to="413" dur="1.4s" begin="0.85s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <text x="742" y="290" text-anchor="end" fill="#ff7a00" font-size="14" font-weight="bold">86</text>
</svg>
