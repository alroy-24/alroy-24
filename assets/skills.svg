<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style><![CDATA[
    @keyframes grow { to { transform: scaleX(1); } }
    .bar { transform: scaleX(0); transform-origin: left; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
    .b1{animation-delay:.15s}.b2{animation-delay:.25s}.b3{animation-delay:.35s}
    .b4{animation-delay:.45s}.b5{animation-delay:.55s}.b6{animation-delay:.65s}
  ]]></style>

  <rect x="1" y="1" width="758" height="294" rx="16" fill="#0b1020" stroke="#232a4a"/>

  <!-- Data Analysis 90 -> 387 -->
  <text x="34" y="50" fill="#c7d0e8" font-size="15">Data Analysis</text>
  <rect x="250" y="40" width="430" height="7" rx="3.5" fill="#1b2140"/>
  <rect class="bar b1" x="250" y="40" width="387" height="7" rx="3.5" fill="#818cf8"/>
  <text x="726" y="50" text-anchor="end" fill="#aab4d4" font-size="13">90</text>

  <!-- Machine Learning 88 -> 378 -->
  <text x="34" y="92" fill="#c7d0e8" font-size="15">Machine Learning</text>
