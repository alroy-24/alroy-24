  <rect class="bar b2" x="250" y="82" width="378" height="7" rx="3.5" fill="#a78bfa"/>
  <text x="726" y="92" text-anchor="end" fill="#aab4d4" font-size="13">88</text>

  <!-- NLP 85 -> 366 -->
