  <rect class="bar b3" x="250" y="124" width="366" height="7" rx="3.5" fill="#c084fc"/>
  <text x="726" y="134" text-anchor="end" fill="#aab4d4" font-size="13">85</text>

  <!-- Deep Learning 84 -> 361 -->
  <text x="34" y="176" fill="#c7d0e8" font-size="15">Deep Learning</text>
  <rect x="250" y="166" width="430" height="7" rx="3.5" fill="#1b2140"/>
  <rect class="bar b4" x="250" y="166" width="361" height="7" rx="3.5" fill="#e879f9"/>
